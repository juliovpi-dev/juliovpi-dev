name: Update Minesweeper contribution graph
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/minesweeper.yml
permissions:
  contents: write
concurrency:
  group: minesweeper
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate light and dark Minesweeper animations
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: ${{ github.repository_owner }}
          games: minesweeper
      - name: Save animations
        run: |
          mkdir -p assets
          cp dist/minesweeper-contribution-graph.svg assets/
          cp dist/minesweeper-contribution-graph-dark.svg assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/minesweeper-contribution-graph*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh Minesweeper contribution animation'
            git push
          fi
